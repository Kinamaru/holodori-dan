
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きなまる式 ホロドリ非公式クラス認定</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#263449;font-family:system-ui,sans-serif}
header{background:#fff;padding:22px 16px;text-align:center;border-bottom:1px solid #dce4ef}
h1{font-size:20px;margin:0;color:#2463a6}
header p{font-size:11px;color:#8190a3;margin:7px 0 0}
main{max-width:560px;margin:auto;padding:18px 14px 90px}
.panel{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #183b6010}
h2{font-size:17px;margin:0 0 14px}
button{border:0;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:bold;background:#2875c7;color:white}
button:disabled{opacity:.4}
button.sub{background:#eaf1fa;color:#285b91}
button.danger{background:#bd4050}
button:active{transform:scale(.98)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.level{background:#edf4fc;color:#245e9b;padding:18px 5px;font-size:22px}
.level.selected{background:#286db5;color:white}
.small{font-size:12px;color:#718096}
.life{font-size:32px;font-weight:800;text-align:center;letter-spacing:5px}
.song{font-size:20px;font-weight:bold;text-align:center;padding:20px 5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.row button{min-width:45px}
.count{font-size:19px;font-weight:bold;min-width:25px;text-align:center}
.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce4ef;display:flex;justify-content:center;gap:10px;padding:10px;z-index:3}
nav button{flex:1;max-width:180px}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f5}
</style>
</head>
<body>
<header>
<h1>きなまる式 ホロドリ非公式クラス認定</h1>
<p>HOLODORI / CREATIVE CLASS</p>
</header>
<main>
<section id="home">
<div class="panel">
<h2>クラス認定へようこそ！</h2>
<p class="small">楽曲に挑戦して、自分のクラスを認定しよう。</p>
<button style="width:100%" onclick="show('classes')">クラス認定へ</button>
</div>
<div class="panel">
<h2>認定記録</h2>
<div class="stat"><span>挑戦回数</span><b id="total">0</b></div>
<div class="stat"><span>合格回数</span><b id="passed">0</b></div>
<div class="stat"><span>合格率</span><b id="rate">0%</b></div>
</div>
</section>

<section id="classes" class="hidden">
<div class="panel">
<h2>クラス認定</h2>
<p class="small">挑戦するクラスを選択してください。</p>
<div class="levels">
<button class="level" onclick="choose('Ⅰ')">Ⅰ</button>
<button class="level" onclick="choose('Ⅱ')">Ⅱ</button>
<button class="level" onclick="choose('Ⅲ')">Ⅲ</button>
<button class="level" onclick="choose('Ⅳ')">Ⅳ</button>
<button class="level" onclick="choose('Ⅴ')">Ⅴ</button>
<button class="level" onclick="choose('Ⅹ')">Ⅹ</button>
</div>
<p class="small" id="classInfo">クラスを選択してください。</p>
<div id="secret" class="hidden">
<button style="width:100%;background:#302044" onclick="choose('∞')">∞ SECRET CLASS</button>
</div>
</div>
</section>

<section id="confirm" class="hidden">
<div class="panel">
<h2>挑戦クラス確認</h2>
<div class="life" id="confirmClass"></div>
<p class="small" id="confirmInfo"></p>
<button style="width:100%" onclick="start()">抽選開始！</button>
<button class="sub" style="width:100%;margin-top:9px" onclick="show('classes')">戻る</button>
</div>
</section>

<section id="challenge" class="hidden">
<div class="panel">
<h2 id="progress">1曲目 / 3曲</h2>
<div class="life" id="lifeDisplay">LIFE 25</div>
<div class="song" id="songName"></div>
<p class="small" style="text-align:center">結果を入力してください</p>
<div id="inputs"></div>
<button style="width:100%;margin-top:15px" onclick="confirmResult()">入力完了</button>
</div>
</section>

<section id="result" class="hidden">
<div class="panel">
<h2 id="resultTitle">認定結果</h2>
<div class="life" id="finalLife"></div>
<div id="resultSongs"></div>
<button style="width:100%;margin-top:15px" onclick="show('classes')">クラス認定へ戻る</button>
</div>
</section>

<section id="records" class="hidden">
<div class="panel">
<h2>結果・記録</h2>
<div id="recordList" class="small">まだ記録はありません。</div>
</div>
</section>
</main>
<nav>
<button class="sub" onclick="show('home')">ホーム</button>
<button class="sub" onclick="show('classes')">クラス認定</button>
<button class="sub" onclick="show('records')">結果・記録</button>
</nav>
<script>
const pools={
"Ⅹ":{
life:25,
songs:[
"星屑カプセル","Play Dice !","爆ラブ+ケミストリー",
"ホットダック！","メギツネ","Lifetime Showtime","GHOST",
"ころねの最凶天災☆わんだふぁー♡わーるど",
"マーシャル・マキシマイザー","Carbonated Love","なかま歌",
"Slap by Step","地獄でおあうぜ！スパちょこるなたん",
"シミュラクル","青く在れ","ばーちゃらぶ","怪宴スペクタクル",
"ぽ","チェリーポップ","CORE//UNBREAKABLE",
"Miracle Palette","ω猫","Grave of Halo","リーサルドーズ・パラノイド",
"幽霊船戦","夢色ワンダー","ヒャダインのじょーじょーゆーじょー",
"PSYCHO","Monsters and Men","FIRE BIRD","KINGWORLD","六兆年と一夜物語"
]},
"∞":{
life:10,
songs:[
"Grave of Halo","リーサルドーズ・パラノイド","幽霊船戦",
"夢色ワンダー","ヒャダインのじょーじょーゆーじょー",
"PSYCHO","Monsters and Men","FIRE BIRD","KINGWORLD","六兆年と一夜物語"
]}
};
let cls="Ⅹ",life=25,index=0,draw=[],counts={},history=[];
const deductions={GREAT:1,GOOD:2,BAD:3,MISS:5};
function show(id){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="home")updateStats();
if(id==="records")renderRecords();
}
function choose(c){
if(!pools[c]){
document.getElementById("classInfo").textContent="このクラスの楽曲リストは準備中です。";
return;
}
cls=c;
document.getElementById("confirmClass").textContent=c;
document.getElementById("confirmInfo").textContent="初期LIFE："+pools[c].life+" / 3曲挑戦";
show("confirm");
}
function start(){
life=pools[cls].life;index=0;draw=[];counts={};
for(let i=0;i<3;i++){
const a=pools[cls].songs;
draw.push(a[Math.floor(Math.random()*a.length)]);
}
show("challenge");renderSong();
}
function renderSong(){
document.getElementById("progress").textContent=(index+1)+"曲目 / 3曲";
document.getElementById("lifeDisplay").textContent="LIFE "+life;
document.getElementById("songName").textContent=draw[index];
counts={GREAT:0,GOOD:0,BAD:0,MISS:0};
document.getElementById("inputs").innerHTML=Object.keys(counts).map(k=>
`<div class="row"><b>${k}（-${deductions[k]}）</b>
<button class="sub" onclick="change('${k}',-1)">−</button>
<span class="count" id="v${k}">0</span>
<button class="sub" onclick="change('${k}',1)">＋</button></div>`
).join("");
}
function change(k,d){
counts[k]=Math.max(0,counts[k]+d);
document.getElementById("v"+k).textContent=counts[k];
}
function confirmResult(){
let loss=0;
for(const k in counts)loss+=counts[k]*deductions[k];
life=Math.max(0,life-loss);
history.push({class:cls,song:draw[index],counts:{...counts},life});
if(index<2){index++;renderSong();}
else finish();
}
function finish(){
const ok=life>=1;
document.getElementById("resultTitle").textContent=ok?"合格！":"不合格";
document.getElementById("finalLife").textContent="LIFE "+life;
document.getElementById("resultSongs").innerHTML=history.slice(-3).map((r,i)=>
`<div class="stat"><span>${i+1}曲目：${r.song}</span><b>LIFE ${r.life}</b></div>`
).join("");
const records=JSON.parse(localStorage.getItem("holodoriRecords")||"[]");
records.unshift({class:cls,ok,life,date:new Date().toLocaleString(),songs:history.slice(-3)});
localStorage.setItem("holodoriRecords",JSON.stringify(records.slice(0,10)));
show("result");
}
function renderRecords(){
const r=JSON.parse(localStorage.getItem("holodoriRecords")||"[]");
document.getElementById("recordList").innerHTML=r.length?r.map(x=>
`<div class="stat"><span>${x.class} / ${x.date}</span><b>${x.ok?"合格":"不合格"}</b></div>`
).join(""):"まだ記録はありません。";
}
function updateStats(){
const r=JSON.parse(localStorage.getItem("holodoriRecords")||"[]");
document.getElementById("total").textContent=r.length;
document.getElementById("passed").textContent=r.filter(x=>x.ok).length;
document.getElementById("rate").textContent=(r.length?Math.round(r.filter(x=>x.ok).length/r.length*100):0)+"%";
}
let taps=0;
document.querySelectorAll(".level").forEach(b=>{
if(b.textContent==="Ⅹ")b.addEventListener("click",()=>{
taps++;
if(taps>=5){document.getElementById("secret").classList.remove("hidden");taps=0;}
});
});
show("home");
</script>
</body>
</html>
